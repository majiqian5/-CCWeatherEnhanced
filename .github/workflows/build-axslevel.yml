name: build-autoload

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 检查源码
        run: |
          set -e
          wc -l AxsAutoLoad.m axs_boot.sh
          grep -c posix_spawn AxsAutoLoad.m

      - name: 编译 arm64e
        run: |
          set -e
          mkdir -p out
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 -isysroot "$SDK" -dynamiclib -O2 -fobjc-arc -framework Foundation -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/AxsAutoLoad.dylib -o out/AxsAutoLoad.dylib AxsAutoLoad.m

      - name: 签名
        run: |
          set -e
          brew install ldid 2>/dev/null || true
          if command -v ldid >/dev/null; then ldid -Sent.plist out/AxsAutoLoad.dylib; fi

      - name: 校验
        run: |
          lipo -info out/AxsAutoLoad.dylib
          otool -hv out/AxsAutoLoad.dylib | head -6

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: autoload-arm64e
          path: |
            out/AxsAutoLoad.dylib
            AxsAutoLoad.plist
            axs_boot.sh
