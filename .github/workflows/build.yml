name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: 递归查找并解压所有 zip
      run: |
        echo "查找 zip 文件..."
        find . -name "*.zip" -type f
        for z in $(find . -name "*.zip" -type f); do
          echo "解压: $z"
          unzip -o "$z" -d /tmp/source_extract
        done
        if [ -d "/tmp/source_extract/CCWeatherEnhanced" ]; then
          cp -r /tmp/source_extract/CCWeatherEnhanced/* .
          cp -r /tmp/source_extract/CCWeatherEnhanced/.* . 2>/dev/null || true
        else
          cp -r /tmp/source_extract/* . 2>/dev/null || true
        fi
        echo "解压完成，当前文件："
        ls -la
        echo "子目录："
        find . -maxdepth 2 -type d
    
    - name: 安装 Theos
      run: |
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
    
    - name: 安装 iOS SDK
      run: |
        git clone https://github.com/theos/sdks.git ~/theos/sdks
    
    - name: 编译
      run: |
        export THEOS=~/theos
        make clean package FINALPACKAGE=1
      env:
        THEOS: /Users/runner/theos
    
    - name: 上传 DEB
      uses: actions/upload-artifact@v4
      with:
        name: CCWeatherEnhanced-deb
        path: "**/*.deb"
        if-no-files-found: error
