name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: 解压源码并定位目录
      run: |
        echo "=== 当前文件 ==="
        ls -la
        find . -name "*.zip" -type f
        rm -rf /tmp/src
        mkdir -p /tmp/src
        for z in $(find . -name "*.zip" -type f); do
          unzip -o "$z" -d /tmp/src
        done
        if [ -f "/tmp/src/CCWeatherEnhanced/Makefile" ]; then
          cp -r /tmp/src/CCWeatherEnhanced/* .
          cp -r /tmp/src/CCWeatherEnhanced/.* . 2>/dev/null || true
        elif [ -f "/tmp/src/Makefile" ]; then
          cp -r /tmp/src/* .
          cp -r /tmp/src/.* . 2>/dev/null || true
        fi
        ls -la
    
    - name: 安装 Theos
      run: |
        rm -rf ~/theos
        git clone --recursive https://github.com/theos/theos.git ~/theos
    
    - name: 安装 ldid（签名工具）
      run: |
        brew install ldid
        which ldid
        ldid --version 2>&1 || true
    
    - name: 安装 iOS SDK
      run: |
        rm -rf ~/theos/sdks
        git clone https://github.com/theos/sdks.git ~/theos/sdks
    
    - name: 编译
      run: |
        export THEOS=~/theos
        export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
        make clean package FINALPACKAGE=1
      env:
        THEOS: /Users/runner/theos
    
    - name: 列出产物
      run: |
        find . -name "*.deb" -type f
    
    - name: 上传 DEB
      uses: actions/upload-artifact@v4
      with:
        name: CCWeatherEnhanced-deb
        path: "**/*.deb"
        if-no-files-found: error
