name: Build CCWeatherEnhanced

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: 解压源码（如果有zip）
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          for z in *.zip; do
            unzip -o "$z" -d /tmp/src
          done
          if [ -f "/tmp/src/CCWeatherEnhanced/Makefile" ]; then
            cp -r /tmp/src/CCWeatherEnhanced/* .
            cp -r /tmp/src/CCWeatherEnhanced/.* . 2>/dev/null || true
          fi
        fi
        ls -la
    
    - name: 安装依赖
      run: |
        brew install ldid dpkg
    
    - name: 安装 Theos
      run: |
        rm -rf ~/theos
        git clone --recursive https://github.com/theos/theos.git ~/theos
    
    - name: 安装 iOS SDK
      run: |
        rm -rf ~/theos/sdks
        git clone https://github.com/theos/sdks.git ~/theos/sdks
    
    - name: 编译
      run: |
        export THEOS=~/theos
        export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
        make clean package FINALPACKAGE=1
      env:
        THEOS: /Users/runner/theos
    
    - name: 验证 deb 内容
      run: |
        DEB=$(find . -name "*.deb" | head -1)
        echo "DEB: $DEB"
        mkdir -p /tmp/verify
        dpkg-deb -x "$DEB" /tmp/verify
        echo "=== 文件结构 ==="
        find /tmp/verify -type f | sort
        echo ""
        echo "=== Prefs 类型（应为 dynamically linked shared library）==="
        file /tmp/verify/var/jb/Library/PreferenceBundles/CCWeatherPrefs.bundle/CCWeatherPrefs
        echo ""
        echo "=== Module 类型 ==="
        file /tmp/verify/var/jb/Library/ControlCenter/Bundles/CCWeatherModule.bundle/CCWeatherModule
        echo ""
        echo "=== Tweak 类型 ==="
        file /tmp/verify/var/jb/Library/MobileSubstrate/DynamicLibraries/CCWeatherTweak.dylib
    
    - name: 上传 DEB
      uses: actions/upload-artifact@v4
      with:
        name: CCWeatherEnhanced-deb
        path: "**/*.deb"
        if-no-files-found: error
